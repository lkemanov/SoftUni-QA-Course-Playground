name: Website languages in sync

on:
  push:
    paths: ["website/**", "tools/translate_site.py"]
  pull_request:
    paths: ["website/**", "tools/translate_site.py"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate English and German pages
        run: python3 tools/translate_site.py
      - name: Fail if en.html or de.html is out of date
        run: git diff --exit-code -- website/en.html website/de.html
